<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6E1A26">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/course.css">
<title>曳行コース｜小垣内参拾人組</title>
<meta name="description" content="令和八年 小垣内区だんじり祭の曳行コース。試験曳き・本曳きの予定位置を地図で確認できます。">
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="top-title">
      <a class="top-org" href="../">小垣内参拾人組</a>
      <h1>令和八年 曳行コース</h1>
    </div>
  </div>
</header>

<main class="index-main">
  <p class="index-lead">日にちを選ぶと、時間ごとのだんじりの予定位置を地図で確認できます。</p>
  <ul class="day-list">
    <li><a class="day-card" href="shiken/" data-date="2026-10-04"><b>試験曳き</b><span>10月4日（日）12:00〜17:00</span><span class="go">地図を見る</span></a></li>
    <li><a class="day-card" href="10/" data-date="2026-10-10"><b>本曳き 1日目</b><span>10月10日（土）5:30〜22:00</span><span class="go">地図を見る</span></a></li>
    <li><a class="day-card" href="11/" data-date="2026-10-11"><b>本曳き 2日目</b><span>10月11日（日）8:00〜22:00</span><span class="go">地図を見る</span></a></li>
  </ul>
  <p class="note">※曳行の都合により、コースおよび時間が前後する場合があります。</p>
  <a class="ouen" href="https://osakana-design.github.io/ogaito30ningumi/">小垣内参拾人組を応援する<small>御花・オンライン寄附「オガファン」</small></a>
</main>

<script>
// 当日の日程に「本日」の印を付ける
(function () {
  var today = new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Tokyo' }).slice(0, 10);
  document.querySelectorAll('.day-card').forEach(function (a) {
    if (a.dataset.date !== today) return;
    a.classList.add('is-today');
    a.querySelector('b').insertAdjacentHTML('beforeend', '<span class="today">本日</span>');
  });
})();
</script>
</body>
</html>
